    <script>
      // Suppress benign Vite HMR websocket reconnection errors in sandboxed Cloud Run iframe
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
